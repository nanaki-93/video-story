[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tabi-story-studio"
version = "0.1.0"
description = "Local production tools for authored Tabi music stories"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.135,<1",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.41,<1",
]

[project.scripts]
tabi = "tabi.cli.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
audit = ["pillow>=11,<13"]

[tool.hatch.build.targets.wheel]
packages = ["src/tabi"]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hook.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/schemas", "/web/src", "/web/scripts", "/web/tests", "/web/index.html", "/web/package.json", "/web/package-lock.json", "/web/vite.config.ts", "/web/tsconfig.json", "/web/.prettierignore", "/web/.npmrc", "/pyproject.toml", "/README.md", "/THIRD-PARTY.md", "/uv.lock", "/Makefile", "/.python-version"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["media: actual FFmpeg render/decode checks; opt in with --run-media"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
